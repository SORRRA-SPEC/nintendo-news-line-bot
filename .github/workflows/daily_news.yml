name: Daily Nintendo News Bot

on:
  schedule:
    # 毎朝 7:00 (JST) に自動実行する設定（UTC 22:00 = JST 07:00）
    - cron: '0 22 * * *'
  # 手動でテスト実行できるようにする設定
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-dotenv

      - name: メインスクリプトの実行
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
        run: |
          python main.py